<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AG ONE - Enterprise SaaS Marketplace" />
    <title>AG ONE - Enterprise SaaS Marketplace</title>
    <base href="/" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- Styles -->
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link href="css/app.css" rel="stylesheet" />
    <link href="css/header.css" rel="stylesheet" />
    <link href="css/footer.css" rel="stylesheet" />
    <link href="css/home-page.css" rel="stylesheet" />
    <link href="css/ai-chat.css" rel="stylesheet" />
    <link href="https://aginternalaistorage.blob.core.windows.net/agonedesignsystem/agone.css" rel="stylesheet" />
    
    <style>
        html, body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }
        
        /* Simple loading bar */
        .loading-container {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 9999;
        }
        
        .loading-bar {
            height: 3px;
            background: linear-gradient(90deg, #4779F7, #7742FF, #4779F7);
            background-size: 200% 100%;
            animation: loading 1.5s infinite linear;
        }
        
        @keyframes loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        
        .loading-text {
            text-align: center;
            padding: 20px;
            color: #6B7280;
            font-size: 14px;
        }
        
        #blazor-error-ui {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1rem;
            background: #FEE2E2;
            color: #991B1B;
            text-align: center;
            font-size: 14px;
            z-index: 9999;
        }
        
        #blazor-error-ui .dismiss {
            cursor: pointer;
            margin-left: 20px;
            background: transparent;
            border: 1px solid #991B1B;
            padding: 4px 12px;
            border-radius: 4px;
            color: #991B1B;
        }
    </style>
</head>

<body>
    <div id="app">
        <div class="loading-container">
            <div class="loading-bar"></div>
        </div>
        <div class="loading-text">Loading application...</div>
    </div>

    <div id="blazor-error-ui">
        An error occurred. 
        <a href="" class="reload">Reload</a>
        <button class="dismiss">Dismiss</button>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
